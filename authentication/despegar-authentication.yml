notes: >-
  The B2B Despegar REST API is authenticated with a single API key sent in the
  x-apikey header. Keys are provisioned per client during onboarding with
  permissions tailored to the products contracted, and separate keys exist for
  the test and production environments. A JWT bearer scheme (BearerAuth) is also
  declared in the OpenAPI. The separately documented MCP B2B servers use OAuth
  2.0 client_credentials (see mcp/despegar-mcp.yml).
