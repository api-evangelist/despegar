  /airlines:
    get:
      tags:
      - Suggestions
      summary: airlines
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                    alliance:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                    sellable:
                      type: boolean
                    accounting_code:
                      type: number
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
  /suggestions/countries:
    get:
      tags:
      - Suggestions
      summary: countries
      parameters:
      - in: query
        name: locale
        required: false
        schema:
          type: string
        description: string which contains language and country, in that order and separated by dash
        example: pt_BR
      - in: query
        name: hint
        required: false
        schema:
          type: string
        example: MEX
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: number
                        target:
                          type: object
                          properties:
                            id:
                              type: number
                            gid:
                              type: string
                            code:
                              type: number
                            type:
                              type: number
                            parents:
                              type: array
                        display:
                          type: string
                        highlight:
                          type: string
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
