openapi: 3.2.0
info:
  title: Decolar Booking Commission Update API
  version: 1.0.1
  description: API for flight booking process. Includes pre-booking, payment methods, booking confirmation, and reservation management.
  contact:
    name: API Support
    email: teste@teste.com.us
servers:
- url: https://api-dev.despegar.com/v3
  description: Sandbox
- url: https://apis-uat.despegar.com/v3
  description: UAT
- url: https://api.despegar.com/v3
  description: Production
security:
- ApiKeyAuth: []
tags:
- name: Commission Update
paths:
  /commissions/update:
    put:
      tags:
      - Commission Update
      summary: Commission Update
      description: This service detects price variations for a product, providing the differences between the original and the updated value.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prebook_id:
                  type: string
                commission:
                  type: number
              required:
              - prebook_id
              - commission
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  commission:
                    type: object
                    properties:
                      amount:
                        type: number
                      max_amount:
                        type: number
                      min_amount:
                        type: number
                  total:
                    type: number
                  currency:
                    type: string
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: INVALID_FILTER
                  message:
                    type: string
                    example: Invalid parameter
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: INVALID_FILTER
                  message:
                    type: string
                    example: Invalid parameter
      operationId: putCommissionsUpdate
      x-operation-id-source: derived
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-apikey
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
