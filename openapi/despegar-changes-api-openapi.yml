  /reservations/changes/{transactionId}/checkouts/contexts/{contextId}/flows:
    post:
      tags:
      - Changes
      summary: Alternative Book
      parameters:
      - in: path
        name: transactionId
        required: true
        schema:
          type: string
        description: Transaction ID
      - in: path
        name: contextId
        required: true
        schema:
          type: string
        description: id of the created context in the Alternative Prebook step, found both in its response or in the Prebook Info service under 'checkout_context_id'.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                payment_method:
                  type: object
                  properties:
                    type:
                      type: string
                    selected_plan_id:
                      type: string
                    detail:
                      type: object
                      properties:
                        dvault_token:
                          type: string
                        cardholder_name:
                          type: string
                        installments:
                          type: string
                        interest:
                          type: string
                invoice:
                  type: object
                  properties:
                    fiscal_name:
                      type: string
                    fiscal_status:
                      type: string
                    fiscal_identification:
                      type: object
                      properties:
                        type:
                          type: string
                        number:
