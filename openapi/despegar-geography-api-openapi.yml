openapi: 3.0.3
info:
  title: Activities Availability Geography API
  version: 1.0.0
  description: 'API for activities: tickets, modalities, availability, prebook, payments, and booking. Authentication via API Key.'
servers:
- url: https://api-dev.despegar.com/v3/activities-api
  description: Sandbox
- url: https://apis-uat.despegar.com/v3/activities-api
  description: UAT
- url: https://api.despegar.com/v3/activities-api
  description: Production
security:
- ApiKeyAuth: []
tags:
- name: Geography
paths:
  /countries/{id}:
    get:
      tags:
      - Geography
      summary: countries_id
      description: Returns detailed information for a specific country.
      parameters:
      - in: path
        name: id
        required: true
        description: Unique identifier for this item
        schema:
          type: string
        example: HOTELS
      - in: query
        name: country
        required: false
        schema:
          type: string
      - in: query
        name: product
        required: false
        schema:
          type: string
        example: HOTELS
      - in: query
        name: language
        required: false
        schema:
          type: string
        example: ES%2CPT%2CEN
      - in: query
        name: tags
        required: false
        schema:
          type: array
          items:
            type: string
      - in: query
        name: ratio
        required: false
        schema:
          type: string
      - in: query
        name: options
        required: false
        schema:
          type: array
          items:
            type: string
        description: Optional fields for the response
      - in: query
        name: include
        required: false
        schema:
          type: array
          items:
            type: string
        description: Option to include filtered entities, additional country information, or author and copyright information when requesting pictures
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  item:
                    type: object
                    properties:
                      id:
                        type: number
                      gid:
                        type: string
                      description:
                        type: object
                  configurations:
                    type: array
                  last_update_date:
                    type: string
                    format: date
                  code:
                    type: string
                  picture:
                    type: array
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
  /countries:
    get:
      tags:
      - Geography
      summary: countries
      description: Returns the list of available countries matching the provided search criteria.
      parameters:
      - in: query
        name: country
        required: false
        schema:
          type: string
      - in: query
        name: product
        required: false
        schema:
          type: string
        example: HOTELS
      - in: query
        name: language
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - ES
            - PT
            - EN
        description: A list of ISO codes representing the requested languages
        example: ES%2CPT%2CEN
      - in: query
        name: continent_id
        required: false
        schema:
          type: string
      - in: query
        name: offset
        required: false
        schema:
          type: integer
        description: Offset to start returning countries
      - in: query
        name: limit
        required: false
        schema:
          type: integer
        description: Maximum quantity of entities. If setted to 0 it returns everything
      - in: query
        name: snapshot
        required: false
        schema:
          type: string
        description: Whether to return a snapshot or paginated results
      - in: query
        name: codes
        required: false
        schema:
          type: array
          items:
            type: string
        description: A list of codes to return the cities that has the same ones
      - in: query
        name: options
        required: false
        schema:
          type: array
          items:
            type: string
        description: Optional fields for the response
      - in: query
        name: include
        required: false
        schema:
          type: array
          items:
            type: string
        description: Option to include filtered entities, additional country information or author and copyright information when requesting pictures
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  items:
                    type: object
                    properties:
                      id:
                        type: number
                      gid:
                        type: string
                      descriptions:
                        type: object
                        properties:
                          pt:
                            type: string
                      configurations:
                        type: array
                        items:
                          type: object
                          properties:
                            any_ds_any:
                              type: string
                            any_cruises_any:
                              type: string
                            any_transfers_any:
                              type: string
                            default:
                              type: string
                            any_vr_any:
                              type: string
                            any_cars_any:
                              type: string
                            any_flights_any:
                              type: string
                            any_hotels_any:
                              type: string
                            viajeros.com:
                              type: string
                            any_packages_any:
                              type: string
                      last_update_date:
                        type: string
                        format: date
                      code:
                        type: string
                      capital_id:
                        type: string
                      capital_gid:
                        type: string
                      capital:
                        type: object
                        properties:
                          id:
                            type: number
                          offset:
                            type: number
                      pictures:
                        type: array
                      alternative_code:
                        type: string
                      continent_id:
                        type: number
                      continent_gid:
                        type: string
                      phone_code:
                        type: number
                      intl_access_code:
                        type: number
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
