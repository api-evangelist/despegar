        example: pt_BR
      - in: query
        name: hint
        required: false
        schema:
          type: string
        example: bra
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: number
                        target:
                          type: object
                          properties:
                            id:
                              type: number
                            gid:
                              type: string
                            type:
                              type: number
                            parents:
                              type: object
                              properties:
                                continent:
                                  type: string
                                country:
                                  type: string
                                administrative_division:
                                  type: string
                                city:
                                  type: string
