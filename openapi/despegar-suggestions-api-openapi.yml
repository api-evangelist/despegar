        required: false
        schema:
          type: string
        example: sbox-flights
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        group:
                          type: string
                        display:
                          type: string
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            taregt:
                              type: object
                              properties:
                                id:
                                  type: number
                                gid:
                                  type: string
                                code:
                                  type: string
                                type:
                                  type: number
                                parents:
                                  type: object
                                  properties:
                                    continent:
                                      type: string
                                    country:
                                      type: string
                                    administrative_division:
                                      type: string
                            display:
                              type: string
                            highlight:
                              type: string
                            location:
                              type: object
