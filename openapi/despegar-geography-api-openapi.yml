                            any_hotels_any:
                              type: string
                            viajeros.com:
                              type: string
                            any_packages_any:
                              type: string
                            any_buses_any:
                              type: string
                      last_update_date:
                        type: string
                        format: date
                      code:
                        type: string
                      pictures:
