aid: despegar
name: Despegar
description: >-
  Despegar (Decolar in Brazil) is the leading online travel agency in Latin
  America, selling flights, hotels, activities, car rentals, insurance and
  vacation packages across the region. Its Despegar B2B platform exposes a
  partner API ecosystem so travel agencies and resellers can integrate hotel,
  flight and activity search, pre-booking, payment, booking and after-sales
  (cancellations, rescheduling, special requests) directly into their own
  systems, backed by geo/common-assets reference data and an event/notification
  channel. APIs are versioned under /v3, authenticated with a per-client API
  key (x-apikey header) with separate test and production keys, protected with
  mTLS for B2B transactions, and now also reachable through published Model
  Context Protocol (MCP) servers for AI agents. This profile was enriched from
  Despegar's public developer documentation at api-docs.despegar.com.
