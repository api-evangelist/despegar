openapi: 3.2.0
info:
  title: Aftersale Reschedulings API
  version: 0.0.5
  description: Aftersale API for managing reservations, cancellations, changes, and reschedulings. Specification generated from the reference document and aligned with the provided template style.
servers:
- url: https://api-dev.despegar.com/v3
  description: Sandbox
- url: https://apis-uat.despegar.com/v3
  description: UAT
- url: https://api.despegar.com/v3
  description: Production
security:
- ApiKeyAuth: []
tags:
- name: Reschedulings
  description: Management of major reschedulings.
paths:
  /reschedulings/mock:
    post:
      tags:
      - Reschedulings
      summary: Rescheduling trigger
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  example: MAJOR
                flight_id:
                  type: number
                  description: transaction_id
              required:
              - type
              - flight_id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
                    example: OK
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        field:
                          type: string
                        message:
                          type: string
        '404':
          description: Not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        field:
                          type: string
                        message:
                          type: string
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        field:
                          type: string
                        message:
                          type: string
      operationId: triggerReschedulingMock
  /reschedulings/{id}:
    get:
      tags:
      - Reschedulings
      summary: Rescheduling alternative
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
        description: Rescheduling ID - RS-XXXX
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  is_protected:
                    type: boolean
                    description: It's the alternative that the airline guarantees for an effective and automatic rescheduling.
                  source:
                    type: string
                  itinerary_type:
                    type: string
                  routes:
                    type: object
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        field:
                          type: string
                        message:
                          type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        field:
                          type: string
                        message:
                          type: string
        '404':
          description: Not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        field:
                          type: string
                        message:
                          type: string
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        field:
                          type: string
                        message:
                          type: string
      operationId: getReschedulingAlternative
  /reschedulings/{id}/alternatives/{alternative_id}:
    patch:
      tags:
      - Reschedulings
      summary: Rescheduling accepted
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
        description: Comes from the reservation service - RS-XXXX
      - in: path
        name: alternative_id
        required: true
        schema:
          type: string
        description: 'It comes from the alternative response - ID '
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
                    example: ACCEPT
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        field:
                          type: string
                        message:
                          type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        field:
                          type: string
                        message:
                          type: string
        '404':
          description: Not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        field:
                          type: string
                        message:
                          type: string
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        field:
                          type: string
                        message:
                          type: string
      operationId: acceptReschedulingAlternative
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-apikey
    BearerAuth:
      type: http
      scheme: bearer
